<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Music Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #a4508b, #5f0a87);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player {
      background-color: white;
      width: 300px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
    }

    .cover {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      background-image: url("https://i.imgur.com/Q9qFt3m.jpg");
      background-size: cover;
      background-position: center;
    }

    .song-info {
      margin-top: 15px;
    }

    .song-info h3 {
      margin: 5px 0;
      font-size: 18px;
      color: #333;
    }

    .song-info p {
      margin: 0;
      color: gray;
      font-size: 14px;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .btn {
      background-color: #5f0a87;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #a4508b;
    }

    .progress {
      margin-top: 15px;
      width: 100%;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #5f0a87;
    }
  </style>
</head>
<body>

  <div class="player">
    <div class="cover"></div>
    <div class="song-info">
      <h3>Shape of You</h3>
      <p>Ed Sheeran</p>
    </div>

    <div class="progress">
      <input type="range" value="40">
    </div>

    <div class="controls">
      <button class="btn">⏮️</button>
      <button class="btn">⏯️</button>
      <button class="btn">⏭️</button>
    </div>
  </div>

</body>
</html>
